name: Compilar APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descomprimir el ZIP
        run: |
          unzip -q ./*.zip -d proyecto
          DIR=$(dirname "$(find proyecto -name settings.gradle.kts | head -n 1)")
          echo "BUILD_DIR=$DIR" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar
        working-directory: ${{ env.BUILD_DIR }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: Ubicator-HML-apk
          path: ${{ env.BUILD_DIR }}/app/build/outputs/apk/release/app-release.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Ubicator HML build ${{ github.run_number }}
          files: ${{ env.BUILD_DIR }}/app/build/outputs/apk/release/app-release.apk
